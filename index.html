<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsundoku Toulon - Librairie Manga</title>
    <meta name="description" content="Votre librairie manga indépendante à Toulon. Découvrez nos sorties, notre sélection et réservez vos mangas préférés.">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <!-- Navigation -->
    <nav id="navbar">
        <div class="nav-container">
            <div class="logo" onclick="showSection('accueil')">
                <span class="logo-text">TSUNDOKU</span>
                <span class="logo-subtitle">Toulon</span>
            </div>
            
            <!-- Desktop Navigation -->
            <div class="nav-links">
                <button class="nav-link active" data-section="accueil">Accueil</button>
                <button class="nav-link" data-section="sorties">Sorties</button>
                <button class="nav-link" data-section="selection">Sélection</button>
                <button class="nav-link" data-section="articles">Articles</button>
                <button class="nav-link" data-section="avis">Avis</button>
                <button class="nav-link" data-section="quiz">Quiz</button>
            </div>
            
            <!-- Auth Button -->
            <div class="nav-auth">
                <button id="authBtn" class="btn-primary">Connexion</button>
            </div>
            
            <!-- Mobile Burger -->
            <button class="burger-menu" id="burgerMenu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        
        <!-- Mobile Menu -->
        <div class="mobile-menu" id="mobileMenu">
            <button class="mobile-link active" data-section="accueil">Accueil</button>
            <button class="mobile-link" data-section="sorties">Sorties</button>
            <button class="mobile-link" data-section="selection">Sélection</button>
            <button class="mobile-link" data-section="articles">Articles</button>
            <button class="mobile-link" data-section="avis">Avis</button>
            <button class="mobile-link" data-section="quiz">Quiz</button>
            <button class="mobile-link" id="mobileAuth">Connexion</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="mainContent"></main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-logo">
                <span class="logo-text">TSUNDOKU</span>
                <span class="logo-subtitle">Toulon</span>
            </div>
            
            <div class="footer-info">
                <p><strong>Votre librairie manga indépendante</strong></p>
                <p>📍 123 Avenue de la République, 83000 Toulon</p>
                <p>📞 04 XX XX XX XX | ✉️ contact@tsundoku-toulon.fr</p>
            </div>
            
            <div class="footer-links">
                <button onclick="showSection('accueil')">Accueil</button>
                <button onclick="showSection('sorties')">Sorties</button>
                <button onclick="showSection('selection')">Sélection</button>
                <button onclick="window.open('admin/index.php')">Admin</button>
            </div>
            
            <div class="footer-copyright">
                <p>&copy; 2026 Tsundoku Toulon - Tous droits réservés</p>
            </div>
        </div>
    </footer>

    <!-- Modal Connexion -->
    <div class="modal-overlay" id="modalAuth">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Connexion Admin</h3>
                <button class="modal-close" onclick="closeModal('modalAuth')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formAuth">
                    <div class="form-group">
                        <label class="form-label required">Email</label>
                        <input type="email" class="form-input" name="email" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label required">Mot de passe</label>
                        <input type="password" class="form-input" name="password" required>
                    </div>
                    <button type="submit" class="btn-primary btn-full">Se connecter</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Loader -->
    <div class="loader-overlay" id="loader">
        <div class="loader"></div>
        <p>Chargement...</p>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
